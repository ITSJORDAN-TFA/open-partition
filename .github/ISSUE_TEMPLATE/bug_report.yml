name: Bug report
description: Something went wrong, or the tool did something unexpected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **If a move was interrupted or failed, don't create, delete or resize anything on that disk with other tools.** The data is journaled. Open Partition Manager can resume or undo the move; ask here first if unsure.

        Security problems: please use **Security → Report a vulnerability** instead of a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the window title, or `opm version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Azure VM
        - Other cloud VM
        - Hyper-V or VMware VM
        - Physical machine
        - Test VHD/VHDX only
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows Server 2016 (1607, build 14393)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste the exact error message.
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: Disk layout
      description: Output of `opm list` (elevated) for the disk involved.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Engine log
      description: For a move, the `.log` file next to its journal in `%ProgramData%\OpenPartition\journals` (or `journals\done`).
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed snapshot names, credentials, hostnames and customer data I don't want public.
          required: true
