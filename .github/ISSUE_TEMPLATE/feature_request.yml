name: Feature request
description: Suggest an operation, platform or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do on your server, and what stops you today?
      placeholder: I need to extend C:, but the recovery partition sits right after it…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it should work in the GUI or `opm`.
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround or other tool you use now, if any.
  - type: dropdown
    id: where
    attributes:
      label: Where you'd use it
      multiple: true
      options:
        - Azure VM
        - Other cloud VM
        - Hyper-V or VMware VM
        - Physical server
        - Windows desktop
