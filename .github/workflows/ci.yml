name: CI

# Every push and pull request: build, test, package (downloadable as a run artifact).
# Push to main: also refresh the rolling "preview" pre-release with that build.
# Push a tag vX.Y.Z: publish a GitHub Release with the package, after checking the tag
# matches the version in ProductInfo.cs.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run Hyper-V integration tests on the self-hosted runner
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/engine

      - name: Version
        id: version
        shell: pwsh
        run: |
          $base = ([regex]::Match((Get-Content src/dotnet/OpenPartition.Model/ProductInfo.cs -Raw), 'Version = "([^"]+)"')).Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'.TrimStart('v')
            if ($tag -ne $base) { throw "Tag v$tag does not match ProductInfo.Version $base; bump the version first." }
            $version = $base
          }
          else {
            $version = "$base-preview.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=openpartition-$version-win-x64" >> $env:GITHUB_OUTPUT
          "Building $version"

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Package
        shell: pwsh
        run: ./tools/package/Build-Package.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package }}
          path: |
            artifacts/${{ steps.version.outputs.package }}.zip
            artifacts/${{ steps.version.outputs.package }}.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-results
          path: tests/harness/out/results.json
          if-no-files-found: ignore

  # Latest main build, always at the same address:
  # https://github.com/<owner>/<repo>/releases/tag/preview
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package }}
          path: dist

      - name: Replace the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview dist/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Preview build ${{ needs.build.outputs.version }}" \
            --notes "Latest build of \`main\` (${{ github.sha }}). Not a release: for testing only. Real disks can only be changed on an Azure VM after you take a snapshot; see the README. Check the download against the .sha256 file."

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Open Partition Manager ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --prerelease

  # Needs a self-hosted Windows runner with Hyper-V enabled, running elevated,
  # labelled `hyperv`. Only runs on request until one is registered.
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: [self-hosted, windows, hyperv]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with integration
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Integration
